    padding: 0 36px;
    height: 72px;
    background: linear-gradient(135deg, rgba(4,8,20,0.97) 0%, rgba(0,30,80,0.95) 100%);
    border-bottom: 2px solid rgba(0,89,179,0.5);
    box-shadow: 0 4px 24px rgba(0,20,60,0.35), 0 1px 0 rgba(0,89,179,0.3) inset;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(12px);
  }
  /* subtle shimmer line at top of header */
  header::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent 0%, var(--accent) 30%, #4da6ff 60%, transparent 100%);
    opacity: 0.7;
  }
  .logo { display: flex; align-items: center; gap: 16px; }
  .logo-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    clip-path: polygon(20% 0%, 100% 0%, 80% 100%, 0% 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 2px 12px rgba(0,89,179,0.5);
  }
  .logo-text {
    font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 900;
    letter-spacing: 4px; color: #fff;
    text-shadow: 0 0 20px rgba(100,180,255,0.4);
  }
  .logo-sub { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: rgba(140,170,210,0.8); letter-spacing: 2px; margin-top: 2px; }
  .clock {
    font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 300;
    color: #5ab0ff; letter-spacing: 3px;
    text-shadow: 0 0 14px rgba(90,176,255,0.35);
  }
  .date-line { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: rgba(140,170,210,0.7); text-align: right; letter-spacing: 1px; margin-top: 3px; }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: pulse 2s infinite; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.85)} }

  /* ===== SUMMARY BAR ===== */
  .summary-bar {
    display: flex; gap: 0;
    background: var(--panel2);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,20,60,0.08);
  }
  .summary-item {
    flex:1; padding: 14px 22px;
    background: var(--panel);
    display: flex; align-items: center; gap: 14px;
    border-right: 1px solid var(--border);
    transition: background 0.15s;
  }
  .summary-item:last-child { border-right: none; }
  .summary-item:hover { background: var(--panel2); }
  .summary-label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); display: block; }
  .summary-value { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 700; line-height: 1; }
  .summary-icon { font-size: 22px; opacity: 0.75; }
  .c-ok { color: var(--ok); } .c-warn { color: var(--warn); } .c-danger { color: var(--danger); } .c-accent { color: var(--accent); }

  /* ===== LAYOUT ===== */
  .main { display: flex; height: calc(100vh - 136px); }
  .sidebar {
    width: 210px; min-width: 210px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto; padding: 16px 0;
    box-shadow: 2px 0 12px rgba(0,20,60,0.06);
  }
  .sidebar-title { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); padding: 0 16px 12px; }
  .sidebar-group-title { font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); padding: 14px 16px 6px; border-top: 1px solid var(--border); margin-top: 4px; }
  .aircraft-tab { padding: 11px 16px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.18s; position: relative; }
  .aircraft-tab:hover { background: var(--panel2); }
  .aircraft-tab.active { background: var(--panel2); border-left-color: var(--accent); box-shadow: inset 0 0 0 1px rgba(0,89,179,0.08); }
  .tab-reg { font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; color: var(--text); letter-spacing: 1px; }
  .aircraft-tab.active .tab-reg { color: var(--accent); }
  .tab-model { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--muted); margin-top: 2px; }
  .tab-badge { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 8px; height: 8px; border-radius: 50%; }
  .badge-ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .badge-warn { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
  .badge-danger { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
  .badge-empty { background: var(--dim); }

  .content { flex:1; overflow-y: auto; padding: 28px 32px; }
  .aircraft-panel { display: none; animation: fadeIn 0.22s ease; }
  .aircraft-panel.active { display: block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none} }

  .aircraft-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; }
  .aircraft-reg { font-family: 'Orbitron', sans-serif; font-size: 34px; font-weight: 900; letter-spacing: 2px; color: var(--accent); line-height: 1; }
  .aircraft-model-line { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); letter-spacing: 2px; margin-top: 4px; }

  .status-select-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .status-select {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 2px;
    padding: 7px 16px; border-radius: var(--radius-sm); cursor: pointer; outline: none;
    text-transform: uppercase; box-shadow: var(--shadow-sm);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .status-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,89,179,0.15); }

  .divider-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--muted); margin: 20px 0 14px; display: flex; align-items: center; gap: 12px;
  }
  .divider-label::after { content:''; flex:1; height:1px; background: var(--border); }

  .section-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; margin-bottom: 18px; }
  .section-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }

  /* ===== CARDS ===== */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 20px;
    position: relative; overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.18s, transform 0.18s;
  }
  .card:hover { box-shadow: var(--shadow-md); }
  .card::before {
    content:''; position: absolute; top:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, var(--accent2) 30%, var(--accent) 70%, transparent);
    opacity: 0.35;
    border-radius: var(--radius-md) var(--radius-md) 0 0;
  }
  .card-title { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

  /* ===== EDITABLE FIELDS ===== */
  .field-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
  .field-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); white-space: nowrap; }
  .field-input {
    background: var(--panel2); border: 1px solid var(--dim); border-radius: var(--radius-sm);
    color: var(--text); font-family: 'Orbitron', monospace; font-size: 14px; font-weight: 700;
    padding: 5px 10px; width: 120px; text-align: right; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    box-shadow: inset 0 1px 3px rgba(0,20,60,0.07);
  }
  .field-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,89,179,0.12), inset 0 1px 3px rgba(0,20,60,0.07); }
  .field-input::placeholder { color: var(--dim); font-size: 11px; font-family: 'IBM Plex Mono', monospace; font-weight: 400; }
  .field-unit { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--muted); min-width: 22px; }

  .progress-bar { height: 5px; background: var(--dim); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .progress-fill { height: 100%; border-radius: 99px; transition: width 0.4s ease; }
  .fill-ok { background: var(--signal-green); }
  .fill-warn { background: var(--signal-yellow); }
  .fill-danger { background: var(--signal-red); }
  .fill-empty { background: var(--dim); }
  .pct-line { display: flex; justify-content: space-between; margin-top: 5px; }
  .pct-text { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--muted); }

  /* ===== ITINERARIOS ===== */
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-header-cell { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--muted); text-align:center; padding:4px 0; }
  .cal-cell {
    min-height:56px; border-radius:6px; border:1px solid var(--border);
    background:var(--panel2); padding:3px; cursor:pointer; position:relative;
    transition:background 0.15s;
  }
  .cal-cell:hover { background:var(--dim); }
  .cal-cell.today { border-color:var(--accent); background:rgba(0,89,179,0.08); }
  .cal-cell.selected { border-color:var(--accent); background:rgba(0,89,179,0.15); }
  .cal-cell.other-month { opacity:0.35; }
  .cal-day-num { font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; color:var(--text); }
  .cal-cell.today .cal-day-num { color:var(--accent); }
  .cal-dot { width:6px; height:6px; border-radius:50%; display:inline-block; margin:1px; }
  .cal-dots { display:flex; flex-wrap:wrap; gap:1px; margin-top:2px; }
  .flight-card {
    background:var(--panel2); border:1px solid var(--border); border-radius:10px;
    padding:10px 14px; margin-bottom:8px; display:flex; align-items:center; gap:12px;
  }
  .flight-ac-badge {
    font-family:'Orbitron',sans-serif; font-size:9px; font-weight:700;
    padding:3px 8px; border-radius:6px; white-space:nowrap; flex-shrink:0;
    background:rgba(0,89,179,0.12); color:var(--accent);
  }
  .flight-info { flex:1; min-width:0; }
  .flight-time { font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:700; color:var(--text); }
  .flight-detail { font-family:'IBM Plex Sans',monospace; font-size:10px; color:var(--muted); margin-top:2px; }
  .cal-cell.holiday { background: rgba(196,112,0,0.08); border-color: var(--warn); }
  .cal-cell.holiday .cal-day-num { color: var(--warn); }
  .cal-holiday-label { font-family:'IBM Plex Mono',monospace; font-size:6px; color:var(--warn); line-height:1.2; margin-top:2px; word-break:break-word; }
  @media (max-width:768px) {
    .cal-holiday-label { font-size:5px; }
  }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .form-field { display:flex; flex-direction:column; gap:4px; }
  .form-label { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  .form-select { background:var(--panel2); border:1px solid var(--dim); border-radius:var(--radius-sm); color:var(--text); font-family:'IBM Plex Sans',sans-serif; font-size:11px; padding:5px 8px; outline:none; width:100%; }
  .form-select:focus { border-color:var(--accent); }
  @media (max-width:768px) {
    .cal-cell { min-height:42px; padding:2px; }
    .cal-day-num { font-size:9px; }
    .form-grid { grid-template-columns:1fr; }
  }
  .pendientes-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  .alert-row { display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; padding:7px 12px; border-bottom:1px solid var(--border); }
  .alert-row:last-child { border-bottom:none; }
  .maint-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .maint-row:last-child { border-bottom: none; }
  .maint-input {
    background: var(--panel2); border: 1px solid var(--dim); border-radius: var(--radius-sm);
    color: var(--text); font-family: 'IBM Plex Sans', sans-serif; font-size: 11px;
    padding: 5px 8px; outline: none; transition: border-color 0.15s, box-shadow 0.15s; width: 100%;
  }
  .maint-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,89,179,0.12); }
  .maint-input::placeholder { color: var(--dim); }
  .maint-date { font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
  .days-badge {
    font-family: 'Orbitron', monospace; font-size: 10px; font-weight: 700;
    padding: 3px 9px; border-radius: 99px; white-space: nowrap; min-width: 44px; text-align: center;
  }
  .days-ok { background: rgba(0,229,153,0.1); color: var(--ok); }
  .days-warn { background: rgba(255,170,0,0.1); color: var(--warn); }
  .days-danger { background: rgba(255,68,85,0.1); color: var(--danger); }
  .days-empty { background: var(--dim); color: var(--muted); }

  /* Doc rows */
  .doc-status-badge-inner { display:inline-flex;align-items:center;justify-content:flex-end;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700; }
  .dot { width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0; }
  .doc-row { display: grid; grid-template-columns: 1fr 160px 110px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .doc-row:last-child { border-bottom: none; }
  .doc-name-input {
    background: transparent; border: none; border-bottom: 1px solid var(--dim);
    color: var(--text); font-family: 'IBM Plex Sans', sans-serif; font-size: 11px;
    padding: 3px 0; outline: none; width: 100%;
  }
  .doc-name-input:focus { border-bottom-color: var(--accent); }
  .doc-date-input {
    background: var(--panel2); border: 1px solid var(--dim); border-radius: var(--radius-sm);
    color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    padding: 4px 6px; outline: none; width: 100%;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .doc-date-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,89,179,0.12); }
  .doc-status-sel {
    background: var(--panel2); border: 1px solid var(--dim);
    color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 9px;
    padding: 4px 6px; border-radius: var(--radius-sm); cursor: pointer; outline: none;
    letter-spacing: 1px;
  }
  .add-row-btn {
    margin-top: 10px; padding: 5px 12px;
    background: transparent; border: 1px dashed var(--dim);
    color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    letter-spacing: 1px; cursor: pointer; border-radius: var(--radius-sm); width: 100%;
    transition: all 0.15s;
  }
  .add-row-btn:hover { border-color: var(--accent); color: var(--accent); }

  .save-btn {
    margin-top: 24px; padding: 10px 24px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: none; border-radius: var(--radius-sm);
    color: #fff; font-family: 'Orbitron', sans-serif; font-size: 11px;
    font-weight: 700; letter-spacing: 2px; cursor: pointer;
    transition: opacity 0.15s, box-shadow 0.15s;
    box-shadow: 0 3px 12px rgba(0,60,160,0.3);
  }
  .save-btn:hover { opacity: 0.9; box-shadow: 0 5px 18px rgba(0,60,160,0.4); }
  .save-msg { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ok); margin-left: 12px; opacity: 0; transition: opacity 0.3s; }

  /* Gauge */
  .gauge-wrap { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px; padding: 6px 0; }
  .gauge-svg { width: 120px; height: 70px; }
  .gauge-label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--muted); text-align: center; }
  .gauge-val { font-family: 'Orbitron', monospace; font-size: 14px; font-weight: 700; text-align: center; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 99px; }

  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }

  /* Equipos de Emergencia */
  .emerg-section { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  .emerg-title {
    font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--accent2); margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
  }
  .emerg-title:hover { color: var(--accent); }
  .emerg-body { display: block; }
  .emerg-row { display: grid; grid-template-columns: 1fr 160px 110px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .emerg-row:last-child { border-bottom: none; }
  .emerg-label { font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 700; color: var(--text); }

  /* ===== HAMBURGER BUTTON (solo móvil) ===== */
  .hamburger-btn {
    display: none;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 12px;
    flex-direction: column;
    gap: 5px;
    justify-content: center;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    position: relative;
    z-index: 200;
    min-width: 44px;
    min-height: 44px;
  }
  .hamburger-btn span {
    display: block;
    width: 24px;
    height: 2px;
    background: #fff;
    border-radius: 2px;
    pointer-events: none;
  }

  /* Overlay oscuro para cerrar el drawer */
  .drawer-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 999;
  }
  .drawer-overlay.active { display: block; }

  /* ===== MOBILE RESPONSIVE ===== */
  @media (max-width: 768px) {
    .hamburger-btn { display: flex; }

    .summary-bar { flex-wrap: wrap; }
    .summary-item { flex: 1 1 45%; padding: 10px 12px; }
    .summary-value { font-size: 18px; }

    .main { flex-direction: column; height: auto; }

    /* Drawer lateral deslizante */
    .sidebar {
      position: fixed !important;
      top: 0; left: 0;
      width: 260px !important;
      min-width: 0 !important;
      height: 100vh !important;
      max-height: 100vh !important;
      z-index: 1000;
      border-right: 1px solid var(--border);
      box-shadow: 4px 0 24px rgba(0,0,0,0.25);
      padding: 16px 0;
      display: flex !important;
      flex-direction: column !important;
      overflow-y: auto;
      overflow-x: hidden;
      white-space: normal;
      transform: translateX(-100%);
      transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    }
    .sidebar.open { transform: translateX(0); }

    .sidebar-title { display: block; padding-top: 48px; }
    .sidebar-group-title { display: block; }
    .aircraft-tab {
      display: block;
      padding: 11px 16px;
      border-left: 3px solid transparent;
      border-bottom: none;
      white-space: normal;
    }
    .aircraft-tab.active {
      border-left-color: var(--accent);
      border-bottom: none;
    }
    .tab-model { display: block; }
    .tab-badge { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); }

    .drawer-close-btn {
      position: absolute;
      top: 10px; right: 10px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* Pilotos: ocultar header de tabla en móvil (usamos tarjetas) */
    .pilotos-table-header { display: none !important; }

    /* Pendientes: 1 columna en móvil, filas verticales */
    .pendientes-grid { grid-template-columns: 1fr !important; }
    .alert-row {
      grid-template-columns: 1fr !important;
      gap: 6px;
      padding: 10px 12px;
    }
    .alert-row > span { justify-self: start; }

    /* Contenido sin scroll horizontal */
    .content { padding: 10px; width: 100%; max-width: 100%; overflow-x: hidden; }
    .card { padding: 10px; overflow: hidden; }
    .aircraft-header { flex-direction: column; gap: 8px; }
    .aircraft-reg { font-size: 18px; }

    /* Grids de sección a una columna */
    .section-grid { grid-template-columns: 1fr !important; }
    .section-grid-2 { grid-template-columns: 1fr !important; }

    /* Filas de mantenimiento: nombre arriba, fecha + badge abajo */
    .maint-row {
      grid-template-columns: 1fr auto !important;
      grid-template-rows: auto auto;
      gap: 4px;
    }
    .maint-row .maint-input:first-child { grid-column: 1 / -1; }

    /* Filas de documentos: nombre arriba, fecha + badge abajo */
    .doc-row {
      grid-template-columns: 1fr auto !important;
      grid-template-rows: auto auto;
      gap: 4px;
    }
    .doc-row .doc-name-input { grid-column: 1 / -1; }
    .doc-row .doc-date-input { min-width: 0; }

    /* Filas emergencia */
    .emerg-row { grid-template-columns: 1fr auto !important; gap: 4px; }
    .emerg-row .emerg-label { font-size: 10px; }

    /* Badges compactos */
    .doc-status-badge { min-width: 0 !important; }
    .doc-status-badge-inner { font-size: 8px !important; }
