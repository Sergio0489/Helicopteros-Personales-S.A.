name: Record regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  records:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm run test:privacy
      - run: python3 tests/prospect-email-setup.py
      - run: npm ci
      - name: Use the runner's installed Chrome
        shell: bash
        run: |
          hp_test_chrome="$(command -v google-chrome)"
          test -x "$hp_test_chrome"
          "$hp_test_chrome" --version
          echo "CHROME_BIN=$hp_test_chrome" >> "$GITHUB_ENV"
      - run: npm run test:all

